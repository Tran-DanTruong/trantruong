<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumière Bridal – Váy cưới cao cấp</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
:root{--pk:#FFD6E7;--bl:#DDEEFF;--ch:#F5E6C8;--bg:#fff;--card:#fff;--ink:#4a3b47;--mute:#9a8a96;--line:#f1e4ec;--acc:#d6688f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d171b;--card:#2a2227;--ink:#f6ecf1;--mute:#b9a6b1;--line:#3a2f36;--acc:#ff9cc0}}
:root[data-theme="dark"]{--bg:#1d171b;--card:#2a2227;--ink:#f6ecf1;--mute:#b9a6b1;--line:#3a2f36;--acc:#ff9cc0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.6 Poppins,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;font-weight:500}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0}
svg.i{width:18px;height:18px}
.wrap{max-width:1240px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:18px;padding:12px 0}
.logo{font:700 22px 'Playfair Display',serif;display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap}
.logo span{background:linear-gradient(135deg,var(--pk),var(--bl));width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--acc)}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--pk);border-radius:999px;padding:4px 6px 4px 18px;transition:.3s}
.search:focus-within{box-shadow:0 0 0 4px var(--pk)}
.search input{flex:1;border:0;outline:0;background:none;min-width:0;padding:8px 0}
.btn{border-radius:999px;padding:10px 22px;font-weight:500;background:linear-gradient(135deg,var(--pk),var(--bl));color:#4a3b47;transition:.3s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #ffd6e788}
.btn.o{background:var(--card);border:1.5px solid var(--pk)}.btn.g{background:var(--ch)}
.ic{position:relative;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;transition:.3s}
.ic:hover{background:var(--pk);color:#4a3b47}
.ic b{position:absolute;top:-4px;right:-4px;background:var(--acc);color:#fff;font-size:10px;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav a{padding:6px 16px;border-radius:999px;white-space:nowrap;cursor:pointer;color:var(--mute);transition:.3s}
nav a:hover{background:var(--bl);color:#4a3b47}
section{padding:36px 0}
.h{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.h h2{font-size:28px}
.hero{border-radius:36px;margin-top:18px;padding:48px;background:linear-gradient(120deg,var(--pk),#fff0f6 45%,var(--bl));display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;overflow:hidden;position:relative;color:#4a3b47}
.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.15;margin:12px 0}
.hero .tag{background:var(--ch);padding:5px 16px;border-radius:99px;display:inline-block;font-size:12px;letter-spacing:.1em}
.hero .art{border-radius:200px 200px 28px 28px;overflow:hidden;aspect-ratio:3/4;max-width:340px;margin-left:auto;box-shadow:0 20px 50px #d6688f40;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.cat{text-align:center;cursor:pointer;transition:.3s}.cat:hover{transform:translateY(-4px)}
.cat div{width:92px;height:92px;margin:0 auto 8px;border-radius:50%;overflow:hidden;border:3px solid var(--ch)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.card{background:var(--card);border-radius:24px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:.35s;position:relative}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px #d6688f26}
.card .im{aspect-ratio:3/4;position:relative}.im svg,.tile svg{width:100%;height:100%;display:block}
.card .bd{padding:12px 14px 16px}
.card h3{font:500 14px Poppins;min-height:40px;line-height:1.4}
.pr{color:var(--acc);font-weight:600;font-size:16px}.pr s{color:var(--mute);font-weight:300;font-size:12px;margin-left:6px}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:4px}
.lb{position:absolute;top:12px;left:12px;padding:3px 12px;border-radius:99px;font-size:11px;font-weight:600;background:var(--ch);color:#4a3b47}
.lb.Sale{background:#ff9cc0}.lb.New{background:var(--bl)}
.hb{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:#fffd;display:grid;place-items:center;color:#4a3b47;transition:.3s}
.hb.on{background:var(--acc);color:#fff}.hb:hover{transform:scale(1.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.chip{padding:7px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.3s}
.chip.on{background:var(--pk);color:#4a3b47;border-color:var(--pk)}
select{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 14px}
.flash{background:linear-gradient(135deg,var(--ch),var(--pk));border-radius:32px;padding:24px;color:#4a3b47}
.cd{display:flex;gap:6px;align-items:center}.cd b{background:#fff;border-radius:12px;padding:4px 10px;font-size:18px;min-width:42px;text-align:center}
.bar{height:8px;border-radius:9px;background:#fff8;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.mas{columns:4;column-gap:14px}.tile{break-inside:avoid;margin-bottom:14px;border-radius:24px;overflow:hidden;transition:.4s;cursor:pointer}
.tile:hover{transform:scale(1.02);box-shadow:0 14px 30px #d6688f33}
.det{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding-top:24px}
.main{aspect-ratio:3/4;border-radius:28px;overflow:hidden;cursor:zoom-in}.main svg{transition:transform .25s}
.th{display:flex;gap:10px;margin-top:10px}.th div{width:72px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:2px solid transparent;cursor:pointer}.th .on{border-color:var(--acc)}
.opt{display:inline-flex;min-width:44px;justify-content:center;padding:7px 16px;border-radius:99px;border:1.5px solid var(--line);cursor:pointer;margin:0 6px 6px 0;background:var(--card);transition:.2s}
.opt.on{border-color:var(--acc);background:var(--pk);color:#4a3b47}
.sw{width:34px;height:34px;border-radius:50%;display:inline-block;border:2px solid var(--line);margin-right:8px;cursor:pointer}.sw.on{outline:2px solid var(--acc);outline-offset:2px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:99px;overflow:hidden}.qty button{width:36px;height:36px;background:none}.qty span{min-width:30px;text-align:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row .t{width:70px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;flex:none}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;padding-top:24px}
input.f,textarea.f{width:100%;padding:11px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);margin:4px 0 12px;outline:0}input.f:focus{border-color:var(--acc)}
.pay{display:flex;gap:10px;align-items:center;padding:12px 16px;border:1.5px solid var(--line);border-radius:18px;margin-bottom:8px;cursor:pointer}.pay.on{border-color:var(--acc);background:var(--pk);color:#4a3b47}
.side{display:grid;grid-template-columns:200px 1fr;gap:20px;padding-top:24px}
.side .m a{display:flex;gap:10px;padding:10px 16px;border-radius:99px;cursor:pointer;margin-bottom:4px;align-items:center}.side .m a.on{background:var(--pk);color:#4a3b47}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stats .box b{font:600 22px Poppins;display:block}
.steps{display:flex;gap:6px;margin-top:8px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}.steps i.d{background:var(--acc)}
#chat{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30}
#cp{display:none;width:320px;max-width:calc(100vw - 36px);height:420px;background:var(--card);border-radius:24px;box-shadow:0 20px 50px #0003;margin-bottom:12px;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
#cp.open{display:flex;animation:up .3s}@keyframes up{from{opacity:0;transform:translateY(12px)}}
#cm{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.mg{padding:8px 14px;border-radius:18px;max-width:85%;background:var(--bl);color:#4a3b47}.mg.u{align-self:flex-end;background:var(--pk)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 22px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:40}#toast.s{opacity:1}
.modal{position:fixed;inset:0;background:#0006;backdrop-filter:blur(4px);display:none;place-items:center;z-index:50;padding:20px}.modal.open{display:grid}
.md{background:var(--card);border-radius:28px;padding:28px;max-width:380px;width:100%;animation:up .3s;text-align:center;max-height:90%;overflow:auto}
.gb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:#3c4043;font-weight:500;margin-top:10px;transition:.3s}.gb:hover{box-shadow:0 6px 18px #0002;transform:translateY(-1px)}
.ac{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:18px;cursor:pointer;text-align:left;transition:.2s}.ac:hover{background:var(--bl);color:#4a3b47}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pk),var(--bl));display:grid;place-items:center;font-weight:600;color:#4a3b47;flex:none}
footer{margin-top:40px;background:linear-gradient(135deg,var(--pk),var(--bl));padding:30px 0;color:#4a3b47;text-align:center;border-radius:36px 36px 0 0}
.fade{animation:up .5s}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}.mas{columns:3}}
@media(max-width:820px){.grid{grid-template-columns:repeat(3,1fr)}.hero,.det,.two{grid-template-columns:1fr}.hero{padding:28px}.hero .art{margin:auto}.cats{grid-template-columns:repeat(3,1fr)}.side{grid-template-columns:1fr}.side .m{display:flex;overflow:auto;gap:6px}.stats{grid-template-columns:repeat(2,1fr)}.top{flex-wrap:wrap}.search{order:5;flex-basis:100%}.logo{margin-right:auto}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.mas{columns:2}.h h2{font-size:22px}.cat div{width:72px;height:72px}}
</style></head><body>
<header><div class="wrap"><div class="top">
<div class="logo" onclick="go('')"><span><i data-lucide="heart" class="i"></i></span>Lumière Bridal</div>
<form class="search" onsubmit="event.preventDefault();q=this.q.value;go('');setTimeout(()=>sc('shop'),50)"><i data-lucide="search" class="i"></i><input name="q" placeholder="Tìm váy công chúa, đuôi cá, phụ kiện…"><button class="btn" style="padding:8px 20px">Tìm</button></form>
<button class="ic" id="ub" onclick="user?go('account'):openLogin()" title="Tài khoản"><i data-lucide="user" class="i"></i></button>
<button class="ic" onclick="acct='wish';go('account')" title="Yêu thích"><i data-lucide="heart" class="i"></i><b id="wc"></b></button>
<button class="ic" onclick="go('cart')" title="Giỏ hàng"><i data-lucide="shopping-bag" class="i"></i><b id="cc"></b></button>
</div>
<nav><a onclick="flt.type='';go('')">Trang chủ</a><a onclick="flt.type='';go('');setTimeout(()=>sc('shop'),50)">Váy cưới</a><a onclick="flt.type='Luxury';go('');setTimeout(()=>sc('shop'),50)">Váy dạ hội</a><a onclick="flt.type='Phụ kiện';go('');setTimeout(()=>sc('shop'),50)">Phụ kiện cưới</a><a onclick="go('');setTimeout(()=>sc('gal'),50)">Bộ sưu tập mới</a><a onclick="toast('Blog sắp ra mắt ✨')">Blog</a><a onclick="go('admin')" style="margin-left:auto">Admin</a></nav></div></header>
<main class="wrap" id="app"></main>
<footer><div class="serif" style="font-size:22px">Lumière Bridal</div><p>Hotline 1900 8888 · Thử váy miễn phí · Đổi trả 7 ngày · Bảo hành đường chỉ trọn đời</p></footer>
<div id="chat"><div id="cp"><div style="padding:14px 18px;background:linear-gradient(135deg,var(--pk),var(--bl));color:#4a3b47;font-weight:500">✨ Trợ lý AI chọn váy</div><div id="cm"></div><form style="display:flex;gap:6px;padding:10px" onsubmit="event.preventDefault();ask(this.m)"><input class="f" name="m" style="margin:0" placeholder="VD: dáng cao, ngân sách 20 triệu"><button class="btn" style="padding:8px 14px">Gửi</button></form></div><button class="btn" style="width:56px;height:56px;padding:0;margin-left:auto;display:flex" onclick="$('#cp').classList.toggle('open');lucide.createIcons()"><i data-lucide="message-circle-heart" class="i"></i></button></div>
<div class="modal" id="lm" onclick="if(event.target==this)closeLogin()"><div class="md" id="lb"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),sc=id=>document.getElementById(id)?.scrollIntoView({behavior:'smooth'});
const T=['Công chúa','Đuôi cá','Tối giản','Hàn Quốc','Luxury','Phụ kiện'];
const P=[[1,'Váy công chúa Aurora ren tầng',18900000,24900000,4.9,1280,'Best Seller',0],[2,'Váy đuôi cá Seraphina',15500000,0,4.8,860,'New',1],[3,'Váy tối giản Élise satin',12800000,0,4.7,640,'',2],[4,'Váy cưới Hàn Quốc Hana',9900000,13900000,4.8,2100,'Sale',3],[5,'Váy Luxury Versailles đính pha lê',38000000,0,5,310,'Best Seller',4],[6,'Váy công chúa Cinderella tulle',16700000,19900000,4.9,950,'Sale',0],[7,'Váy đuôi cá Isabelle ren Pháp',17900000,0,4.6,420,'New',1],[8,'Váy tối giản Camille cổ vuông',11200000,14500000,4.7,730,'Sale',2],[9,'Váy Hàn Quốc Soo-ah nơ bồng',10800000,0,4.8,1560,'New',3],[10,'Váy Luxury Marie Antoinette',46000000,0,4.9,180,'',4],[11,'Vương miện pha lê Tiara',2400000,3200000,4.9,3200,'Sale',5],[12,'Voan cưới ren dài 3m',1900000,0,4.8,2780,'Best Seller',5]].map(a=>({id:a[0],n:a[1],p:a[2],o:a[3],r:a[4],s:a[5],tag:a[6],t:T[a[7]]}));
const COL=['Trắng ngọc trai','Hồng phấn','Xanh sương'],HEX=['#ffffff','#FFD6E7','#DDEEFF'];
const fmt=n=>n.toLocaleString('vi-VN')+'₫',byId=i=>P.find(p=>p.id==i);
let u=0,cart=[],wish=new Set([1,4]),q='',flt={type:'',max:0},sel={s:'M',c:0,q:1,i:0,tab:'Mô tả'},acct='profile',adm='dash',pay='COD',vc='',end=Date.now()+3*3600e3+1500;
function dress(p,ci=0,bg=0){const id='g'+ ++u,B=[['#FFD6E7','#DDEEFF'],['#DDEEFF','#fff5f9'],['#F5E6C8','#FFD6E7'],['#fff','#DDEEFF']][bg%4],k=T.indexOf(p.t);
let sp='<g fill="#F5E6C8"><circle cx="28" cy="40" r="3"/><circle cx="170" cy="70" r="2.5"/><circle cx="160" cy="30" r="3.5"/><circle cx="40" cy="120" r="2"/></g>';
if(k==5)return`<svg viewBox="0 0 200 260" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${B[0]}"/><stop offset="1" stop-color="${B[1]}"/></linearGradient></defs><rect width="200" height="260" fill="url(#${id})"/>${sp}<path d="M45 160L58 105 82 140 100 90 118 140 142 105 155 160Z" fill="${HEX[ci]}" stroke="#d9b98a" stroke-width="3"/><g fill="#F5E6C8" stroke="#d9b98a"><circle cx="58" cy="102" r="6"/><circle cx="100" cy="86" r="7"/><circle cx="142" cy="102" r="6"/></g></svg>`;
const S=['M72 112C52 170 22 210 8 244H192C178 210 148 170 128 112Z','M76 112C68 170 80 205 56 244H144C120 205 132 170 124 112Z','M78 112L52 244H148L122 112Z','M74 112C62 160 42 205 34 244H166C158 205 138 160 126 112Z','M70 112C46 170 14 215 2 244H198C186 215 154 170 130 112Z'][k];
const ex=k==4?'<g fill="#F5E6C8" stroke="none"><circle cx="70" cy="190" r="3"/><circle cx="100" cy="210" r="3.5"/><circle cx="130" cy="185" r="3"/><circle cx="85" cy="150" r="2.5"/><circle cx="118" cy="160" r="2.5"/></g>':k==3?'<g fill="#FFD6E7" stroke="#d6688f"><circle cx="92" cy="114" r="7"/><circle cx="108" cy="114" r="7"/></g>':'';
return`<svg viewBox="0 0 200 260" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${B[0]}"/><stop offset="1" stop-color="${B[1]}"/></linearGradient></defs><rect width="200" height="260" fill="url(#${id})"/>${sp}<circle cx="100" cy="42" r="12" fill="#fff" opacity=".85"/><path d="M82 46Q100 20 118 46L130 120H70Z" fill="#fff" opacity=".35"/><g fill="${HEX[ci]}" stroke="#d9b98a" stroke-width="1.4"><path d="M80 62H120L126 112H74Z"/><path d="${S}"/>${ex}</g></svg>`}
function card(p){const on=wish.has(p.id);return`<div class="card fade" onclick="go('p/${p.id}')"><div class="im">${dress(p,0,p.id)}${p.tag?`<span class="lb ${p.tag.replace(' ','')}">${p.tag}</span>`:''}<button class="hb ${on?'on':''}" onclick="event.stopPropagation();fav(${p.id})"><i data-lucide="heart" class="i"></i></button></div><div class="bd"><h3>${p.n}</h3><div class="pr">${fmt(p.p)}${p.o?`<s>${fmt(p.o)}</s>`:''}</div><div class="meta"><span>★ ${p.r}</span><span>Đã bán ${p.s}</span></div></div></div>`}
function fav(i){wish.has(i)?wish.delete(i):wish.add(i);toast(wish.has(i)?'Đã thêm vào yêu thích 💗':'Đã bỏ yêu thích');render(1)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('s'),2200)}
function go(r){location.hash='#/'+r;if(location.hash=='#/'+r)render()}
function add(id,buy){cart.push({id,s:sel.s,c:sel.c,q:sel.q,on:1});toast('Đã thêm vào giỏ hàng 🛍️');buy?go('checkout'):render(1)}
const total=()=>cart.filter(c=>c.on).reduce((a,c)=>a+byId(c.id).p*c.q,0),disc=()=>vc=='YEU'?Math.round(total()*.1):vc=='CUOI'&&total()?500000:0;
function home(){const list=P.filter(p=>(!flt.type||p.t==flt.type)&&(!flt.max||p.p<=flt.max)&&(!q||(p.n+p.t).toLowerCase().includes(q.toLowerCase())));
const cats=[['Công chúa',0],['Đuôi cá',1],['Tối giản',2],['Hàn Quốc',3],['Luxury',4],['Phụ kiện',5]].map(([n,i])=>`<div class="cat" onclick="flt.type='${n}';render();sc('shop')"><div>${dress(P.find(p=>p.t==n),0,i)}</div>${n=='Phụ kiện'?'Phụ kiện cưới':'Váy '+n.toLowerCase()}</div>`).join('');
